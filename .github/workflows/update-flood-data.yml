name: Update Sentinel-1 Flood Data

on:
  schedule:
    # Run automatically every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  process-sentinel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache Baseline "Before" Scene
        id: cache-before
        uses: actions/cache@v6
        with:
          path: data/before
          key: sentinel1-baseline-before-v1

      - name: Ingest Sentinel-1 SAR Data
        id: ingest
        env:
          CDSE_USERNAME: ${{ secrets.CDSE_USERNAME }}
          CDSE_PASSWORD: ${{ secrets.CDSE_PASSWORD }}
        run: python ingest_sentinel1.py

      - name: Run SAR Flood Detection Algorithm
        if: steps.ingest.outputs.new_scene == 'true'
        run: python detect_flood.py

      - name: Clean Up Raw Data
        if: always()
        run: |
          echo "Purging raw raster files and archives..."
          rm -rf data/during
          rm -rf *.SAFE *.SAFE.zip
          find data -maxdepth 3 -type f -name "*.zip" -delete || true

      - name: Commit and Push Updated Flood Data
        if: steps.ingest.outputs.new_scene == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manifest.json data/flood_extent.geojson flood_extent.geojson output/flood_extent.geojson
          if git diff --staged --quiet; then
            echo "No changes detected to commit."
          else
            git commit -m "chore(data): auto-update Sentinel-1 flood extent [skip ci]"
            git push
          fi
