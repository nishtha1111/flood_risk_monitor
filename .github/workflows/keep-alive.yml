name: Keep Render Backend Warm

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier sleep (sleep timeout is 15 minutes)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging live Render backend to maintain active container state..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 60 "https://flood-risk-monitor.onrender.com/api/metadata")
          echo "Render response status: $HTTP_STATUS"
