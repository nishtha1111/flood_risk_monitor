name: Keep Render Backend Warm

on:
  schedule:
    # Every 10 min: GitHub cron can run late, so leave margin under Render's 15 min sleep
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render Backend
        run: |
          echo "Pinging live Render backend to maintain active container state..."
          for attempt in 1 2 3 4; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -m 90 "https://flood-risk-monitor.onrender.com/api/metadata" || true)
            echo "Attempt $attempt: Render response status: $HTTP_STATUS"
            if [ "$HTTP_STATUS" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Backend did not return 200 after 4 attempts"
          exit 1
